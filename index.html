<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Library Management System</h1>
      <p>Manage book inventory, track borrowed items, and search your catalog.</p>
    </header>

    <!-- Add Book Form -->
    <section class="card">
      <h2>Add a New Book</h2>
      <form id="book-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="title">Book Title</label>
            <input type="text" id="title" placeholder="e.g., The Hobbit" required>
          </div>
          <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" placeholder="e.g., J.R.R. Tolkien" required>
          </div>
          <div class="form-group">
            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" placeholder="e.g., 978-0547928227" required>
          </div>
          <div class="form-group">
            <label for="genre">Genre</label>
            <select id="genre">
              <option value="Fiction">Fiction</option>
              <option value="Non-Fiction">Non-Fiction</option>
              <option value="Science">Science & Tech</option>
              <option value="History">History</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Add Book</button>
      </form>
    </section>

    <!-- Book Catalog & Search -->
    <section class="card">
      <div class="catalog-header">
        <h2>Book Catalog (<span id="book-count">0</span>)</h2>
        <input type="text" id="search-input" placeholder="Search by title, author, or ISBN...">
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>ISBN</th>
              <th>Genre</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="book-list">
            <!-- Books will render here dynamically -->
          </tbody>
        </table>
      </div>
    </section>
  </div>
  <img src="https://img.magnific.com/free-vector/book-floating-cartoon-vector-icon-illustration-education-object-icon-isolated-flat-vector_138676-13661.jpg?semt=ais_hybrid&w=740&q=80" alt="book illustration" class="book-image">

  <script src="script.js"></script>
</body>
</html>
